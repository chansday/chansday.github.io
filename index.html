<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>chansday</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="site-header">
  <nav class="nav">
    <a href="#home" class="nav-brand">chansday</a>
    <button class="nav-toggle" id="navToggle" aria-label="메뉴 열기">☰</button>
    <ul class="nav-links" id="navLinks">
      <li><a href="#home">Home</a></li>
      <li><a href="#about">About</a></li>
      <li><a href="#games">Games</a></li>
    </ul>
  </nav>
</header>

<main>
  <section id="home" class="section">
    <h1>ChansDay</h1>
  </section>

  <section id="about" class="section">
    <h2>About</h2>
    <h3>Skills</h3>
    <p>ComDoll2</p>
  </section>

  <section id="games" class="section">
    <h2>Games</h2>
    <div id="game-area" class="game-area">
      <div class="game-hud">
        <span>Score: <span id="score">0</span></span>
        <span>High Score: <span id="highScore">0</span></span>
      </div>
      <canvas id="gameCanvas" width="360" height="360" aria-label="지렁이 게임 화면"></canvas>
      <div class="game-buttons">
        <button id="startBtn">Start</button>
        <button id="pauseBtn">Pause</button>
        <button id="restartBtn">Restart</button>
      </div>
      <p id="gameMessage" class="game-message" role="status"></p>
      <div class="touch-controls" aria-label="모바일 방향 조작">
        <button class="touch-btn" id="touchUp" aria-label="위로">▲</button>
        <div class="touch-row">
          <button class="touch-btn" id="touchLeft" aria-label="왼쪽으로">◀</button>
          <button class="touch-btn" id="touchDown" aria-label="아래로">▼</button>
          <button class="touch-btn" id="touchRight" aria-label="오른쪽으로">▶</button>
        </div>
      </div>
    </div>
  </section>
</main>

<script src="script.js"></script>
<script src="game.js"></script>
</body>
</html>
