name: KOSPI update-results

on:
  # Started by scheduler-keeper.yml (workflow_dispatch) at its KST time; the
  # former schedule cron was removed so a 3-6 h late schedule run cannot repeat
  # the stage outside its window and overwrite the stage file.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-results:
    if: github.repository == 'chansday/chansday.github.io'
    uses: ./.github/workflows/_run-stage.yml
    with:
      stage: update-results
      provider: naver-crawl
      run_id: ${{ github.run_id }}
      run_attempt: ${{ github.run_attempt }}
    secrets:
      KOSPI_PROVIDER_API_KEY: ${{ secrets.KOSPI_PROVIDER_API_KEY }}
      KOSPI_PROVIDER_BASE_URL: ${{ secrets.KOSPI_PROVIDER_BASE_URL }}
