name: KOSPI shared stage runner

on:
  workflow_call:
    inputs:
      stage:
        description: "Fixed operating stage supplied by the caller workflow"
        required: false
        default: ""
        type: string
      auto_stage:
        description: "Resolve forecast/open/close from the runner-captured start in KST"
        required: false
        default: false
        type: boolean
      provider:
        description: "Fixed provider supplied by the caller workflow"
        required: true
        type: string
      run_id:
        description: "Caller workflow run id"
        required: true
        type: string
      run_attempt:
        description: "Caller workflow run attempt"
        required: true
        type: string
    secrets:
      KOSPI_PROVIDER_API_KEY:
        required: false
      KOSPI_PROVIDER_BASE_URL:
        required: false

permissions:
  contents: write

concurrency:
  group: kospi-signal-board-pipeline
  cancel-in-progress: false

jobs:
  run-stage:
    if: github.repository == 'chansday/chansday.github.io'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      KOSPI_PROVIDER: ${{ inputs.provider }}
      KOSPI_DAILY_HISTORY: ${{ (inputs.auto_stage || inputs.stage == 'analysis' || inputs.stage == 'forecast' || inputs.stage == 'open-settlement' || inputs.stage == 'close-settlement') && 'naver-cache' || '' }}
      KOSPI_RUN_ID: ${{ inputs.run_id }}.${{ inputs.run_attempt }}
      KOSPI_PROVIDER_API_KEY: ${{ secrets.KOSPI_PROVIDER_API_KEY }}
      KOSPI_PROVIDER_BASE_URL: ${{ secrets.KOSPI_PROVIDER_BASE_URL }}
      KOSPI_PUBLIC_SOURCE_NAME: ${{ vars.KOSPI_PUBLIC_SOURCE_NAME || '' }}
      KOSPI_PUBLIC_SOURCE_URL: ${{ vars.KOSPI_PUBLIC_SOURCE_URL || '' }}
      KOSPI_PUBLIC_SOURCE_LICENSE_STATUS: ${{ vars.KOSPI_PUBLIC_SOURCE_LICENSE_STATUS || 'unconfirmed' }}
      KOSPI_PUBLIC_SOURCE_LICENSE_URL: ${{ vars.KOSPI_PUBLIC_SOURCE_LICENSE_URL || '' }}
      KOSPI_PUBLIC_SOURCE_ALLOWED_HOSTS: ${{ vars.KOSPI_PUBLIC_SOURCE_ALLOWED_HOSTS || '' }}
    steps:
      - name: Capture actual runner start timestamp
        id: capture-run-context
        shell: bash
        run: |
          set -euo pipefail
          run_started_at="$(date -u +'%Y-%m-%dT%H:%M:%S.%3NZ')"
          case "$run_started_at" in
            ????-??-??T??:??:??.???Z) ;;
            *) echo "Generated run-start timestamp is not ISO-8601 UTC: $run_started_at" >&2; exit 1 ;;
          esac
          echo "run_started_at=$run_started_at" >> "$GITHUB_OUTPUT"
          echo "KOSPI_RUN_STARTED_AT=$run_started_at" >> "$GITHUB_ENV"

      - name: Check out repository
        id: checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        id: setup-node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate caller run context
        id: validate-run-context
        run: node scripts/run-context.mjs

      - name: Guard KOSPI trading day
        id: market-day
        run: node scripts/market-session-guard.mjs

      - name: Resolve current KST stage
        id: auto_stage
        if: steps.market-day.outputs.should_run == 'true' && inputs.auto_stage == true
        run: node scripts/run-context.mjs

      - name: Validate the static contract
        id: static-contract
        # Tests must not inherit the stage's live history mode; it makes fixture
        # runs read the repository's Naver daily cache and report degraded.
        env:
          KOSPI_DAILY_HISTORY: ""
        if: steps.market-day.outputs.should_run == 'true'
        run: npm test && npm run check && npm run check:experiment

      - name: Run resolved KOSPI stage
        id: stage
        if: >-
          always() &&
          steps.capture-run-context.outcome == 'success' &&
          steps.capture-run-context.outputs.run_started_at != '' &&
          steps.checkout.outcome == 'success' &&
          steps.setup-node.outcome == 'success' &&
          steps.validate-run-context.outcome == 'success' &&
          steps.market-day.outcome == 'success' &&
          steps.market-day.outputs.should_run == 'true' &&
          (inputs.auto_stage != true || steps.auto_stage.outcome == 'success') &&
          steps.static-contract.outcome == 'success'
        continue-on-error: true
        env:
          RESOLVED_STAGE: ${{ inputs.auto_stage && steps.auto_stage.outputs.stage || inputs.stage }}
        run: node scripts/update-results.mjs --mode "$RESOLVED_STAGE" --run-started-at "${{ steps.capture-run-context.outputs.run_started_at }}" --attempted-at "${{ steps.capture-run-context.outputs.run_started_at }}"

      - name: Collect isolated daily baseline
        id: daily-experiment
        if: >-
          steps.static-contract.outcome == 'success' &&
          (inputs.auto_stage && steps.auto_stage.outputs.stage || inputs.stage) == 'forecast'
        continue-on-error: true
        env:
          EXPERIMENT_DATE: ${{ steps.validate-run-context.outputs.run_date }}
        run: node scripts/daily-baseline-run.mjs "$EXPERIMENT_DATE"

      - name: Evaluate post-close retrospective
        id: retrospective
        if: >-
          steps.market-day.outputs.should_run == 'true' &&
          steps.stage.outcome == 'success' && steps.stage.outputs.status == 'ready' &&
          (inputs.auto_stage && steps.auto_stage.outputs.stage || inputs.stage) == 'close-settlement'
        continue-on-error: true
        env:
          KOSPI_RUN_DATE: ${{ steps.validate-run-context.outputs.run_date }}
        run: node scripts/stage-post-close-evaluation.mjs

      - name: Write workflow summary
        if: always()
        shell: bash
        env:
          RESOLVED_STAGE: ${{ inputs.auto_stage && steps.auto_stage.outputs.stage || inputs.stage }}
        run: |
          if [ "${{ steps.market-day.outputs.should_run }}" != "true" ]; then
            {
              echo "### KOSPI stage: market closed"
              echo "- stage: \`${RESOLVED_STAGE}\`"
              echo "- provider: \`${KOSPI_PROVIDER}\`"
              echo "- collection and snapshot mutation: **not run**"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### KOSPI stage workflow"
              echo "- stage: \`${RESOLVED_STAGE}\`"
              echo "- provider: \`${KOSPI_PROVIDER}\`"
              echo "- reference time: \`${KOSPI_RUN_STARTED_AT}\` (runner-captured start UTC; KST stage is derived from the same value)"
              echo "- manual button and schedule use the same stage command"
              echo "- isolated daily experiment status: ${{ steps.daily-experiment.outputs.status || 'not_run_or_status_write_failed' }}; step: ${{ steps.daily-experiment.outcome }}; status saved: ${{ steps.daily-experiment.outputs.status_saved || 'false' }}"
              echo "- no_data/partial/degraded/blocked results fail the job after the snapshot and summary are written"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit snapshot state when changed
        id: commit
        if: >-
          always() &&
          steps.capture-run-context.outcome == 'success' &&
          steps.capture-run-context.outputs.run_started_at != '' &&
          steps.checkout.outcome == 'success' &&
          steps.setup-node.outcome == 'success' &&
          steps.validate-run-context.outcome == 'success' &&
          steps.market-day.outcome == 'success' &&
          steps.market-day.outputs.should_run == 'true' &&
          (inputs.auto_stage != true || steps.auto_stage.outcome == 'success') &&
          steps.static-contract.outcome == 'success' &&
          steps.stage.outcome == 'success' &&
          steps.stage.outputs.status == 'ready' &&
          ((inputs.auto_stage && steps.auto_stage.outputs.stage || inputs.stage) != 'close-settlement' ||
           (steps.retrospective.outcome == 'success' && steps.retrospective.outputs.status == 'ready'))
        shell: bash
        env:
          RESOLVED_STAGE: ${{ inputs.auto_stage && steps.auto_stage.outputs.stage || inputs.stage }}
        run: |
          set -euo pipefail
          changes="$(git status --short -- data/latest-snapshot.json data/runs)"
          if [ -z "$changes" ]; then
            echo "No snapshot changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/generate-date-index.mjs
          git add data/latest-snapshot.json data/runs data/date-index.json
          git commit -m "chore(data): record KOSPI $RESOLVED_STAGE stage"
          branch="${GITHUB_REF_NAME:-main}"
          pushed=0
          for i in 1 2 3; do
            if git pull --rebase --autostash origin "$branch" && git push origin "HEAD:$branch"; then pushed=1; break; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((i * 5))
          done
          if [ "$pushed" != 1 ]; then echo "::error::git push failed after 3 attempts"; exit 1; fi

      - name: Save isolated daily baseline
        id: save-experiment
        if: >-
          always() && steps.static-contract.outcome == 'success' &&
          (steps.daily-experiment.outputs.saved == 'true' || steps.daily-experiment.outputs.status_saved == 'true')
        shell: bash
        env:
          EXPERIMENT_DATE: ${{ steps.validate-run-context.outputs.run_date }}
          EXPERIMENT_CANDIDATES: ${{ steps.daily-experiment.outputs.candidates }}
          EXPERIMENT_CANDIDATE: ${{ steps.daily-experiment.outputs.candidate }}
          STATUS_SAVED: ${{ steps.daily-experiment.outputs.status_saved }}
          STATUS_HASH: ${{ steps.daily-experiment.outputs.status_hash }}
        run: |
          set -euo pipefail
          bash scripts/stage-daily-experiment.sh
          if git diff --cached --quiet; then echo "No experiment changes to commit."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): record isolated daily experiment $EXPERIMENT_DATE"
          branch="${GITHUB_REF_NAME:-main}"
          pushed=0
          for i in 1 2 3; do
            if git pull --rebase --autostash origin "$branch" && git push origin "HEAD:$branch"; then pushed=1; break; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((i * 5))
          done
          if [ "$pushed" != 1 ]; then echo "::error::git push failed after 3 attempts"; exit 1; fi

      - name: Fail when the stage is not ready
        if: always()
        shell: bash
        env:
          RESOLVED_STAGE: ${{ inputs.auto_stage && steps.auto_stage.outputs.stage || inputs.stage }}
          AUTO_STAGE: ${{ inputs.auto_stage }}
        run: |
          run_started_at="${{ steps.capture-run-context.outputs.run_started_at }}"
          if [ "${{ steps.capture-run-context.outcome }}" != "success" ] || [ -z "$run_started_at" ]; then
            echo "Runner timestamp capture failed or was skipped." >&2
            exit 1
          fi
          case "$run_started_at" in
            ????-??-??T??:??:??.???Z) ;;
            *) echo "Runner timestamp capture produced an invalid or empty ISO-8601 UTC timestamp: '$run_started_at'" >&2; exit 1 ;;
          esac
          if [ "${{ steps.checkout.outcome }}" != "success" ] || [ "${{ steps.setup-node.outcome }}" != "success" ]; then
            echo "Repository checkout or Node.js setup failed or was skipped." >&2
            exit 1
          fi
          if [ "${{ steps.validate-run-context.outcome }}" != "success" ]; then
            echo "Run-context validation failed or was skipped." >&2
            exit 1
          fi
          if [ "${{ steps.market-day.outcome }}" != "success" ]; then
            echo "Trading-day guard failed or was skipped." >&2
            exit 1
          fi
          if [ "${{ steps.market-day.outputs.should_run }}" != "true" ]; then
            echo "Market closed; no collection or calculation was performed."
            exit 0
          fi
          if [ "${{ steps.static-contract.outcome }}" != "success" ]; then
            echo "Static contract validation failed." >&2
            exit 1
          fi
          if [ "$AUTO_STAGE" = "true" ] && [ "${{ steps.auto_stage.outcome }}" != "success" ]; then
            echo "Automatic stage resolution failed or was skipped." >&2
            exit 1
          fi
          if [ "${{ steps.stage.outcome }}" != "success" ]; then
            echo "Stage '$RESOLVED_STAGE' returned no_data, partial, degraded, blocked, or another failure." >&2
            exit 1
          fi
          status="${{ steps.stage.outputs.status }}"
          if [ "$status" != "ready" ]; then
            echo "Stage '$RESOLVED_STAGE' did not return the required ready status: '$status'." >&2
            exit 1
          fi
          if [ "$RESOLVED_STAGE" = "close-settlement" ] && { [ "${{ steps.retrospective.outcome }}" != "success" ] || [ "${{ steps.retrospective.outputs.status }}" != "ready" ]; }; then
            echo "Post-close retrospective failed or was skipped." >&2
            exit 1
          fi
          if [ "${{ steps.commit.outcome }}" != "success" ]; then
            echo "Snapshot commit step failed or was skipped." >&2
            exit 1
          fi

      - name: Fail when the isolated experiment failed
        if: always() && (inputs.auto_stage && steps.auto_stage.outputs.stage || inputs.stage) == 'forecast' && steps.static-contract.outcome == 'success'
        shell: bash
        run: |
          if [ "${{ steps.daily-experiment.outcome }}" != "success" ] || [ "${{ steps.daily-experiment.outputs.status_saved }}" != "true" ] || [ "${{ steps.save-experiment.outcome }}" != "success" ]; then
            echo "Isolated experiment failed, was not recorded, or could not be saved." >&2
            exit 1
          fi
