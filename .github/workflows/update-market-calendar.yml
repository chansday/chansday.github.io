name: "[5 관리] 연간 KRX 휴장일 갱신"

on:
  schedule:
    # 12:00 KST (03:00 UTC) on several late-December days, every year. Once the
    # next year is covered the later runs are no-ops; while KRX has not
    # published it yet a run warns and passes so a later day retries. December
    # 31 is the final attempt and fails if KRX is still unavailable.
    - cron: "0 3 20,24,27,29,31 12 *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Check KRX without changing the calendar"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: kospi-signal-board-pipeline
  cancel-in-progress: false

jobs:
  update-calendar:
    if: github.repository == 'chansday/chansday.github.io'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate current contract
        run: npm test && npm run check && npm run check:experiment
      - name: Fetch next year from KRX
        env:
          KOSPI_CALENDAR_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: node scripts/update-market-calendar.mjs
      - name: Verify updated calendar
        run: npm test && npm run check
      - name: Commit verified calendar
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- data/krx-market-holidays.json; then
            echo "KRX calendar is already current."
            exit 0
          fi
          git add -- data/krx-market-holidays.json
          bash scripts/commit-and-push.sh "chore(data): update KRX market calendar"
