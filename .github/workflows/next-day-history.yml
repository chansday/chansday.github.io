name: "[1 수집] 저녁 일봉·모델 갱신"

on:
  # After the close and after-hours trading (18:00 KST) of a trading day:
  # collects the daily bars, trains the forecast models and computes the rank
  # forecast for the next trading day. The 06:10 KST morning run verifies this
  # cache and replaces it only if the bars changed. Several starts absorb late
  # schedule events; a complete cache is kept, so repeats are no-ops, and a start
  # delayed past midnight becomes that morning's collection.
  schedule:
    - cron: "45 9 * * 1-5"   # 18:45 KST Mon-Fri
    - cron: "0 11 * * 1-5"   # 20:00 KST
    - cron: "30 13 * * 1-5"  # 22:30 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kospi-signal-board-pipeline
  cancel-in-progress: false

jobs:
  collect:
    if: github.repository == 'kospi-signal/kospi-signal.github.io'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        id: log_step_01
      - uses: actions/setup-node@v7
        id: log_step_02
        with:
          node-version: 22
      - id: market
        run: node scripts/market-session-guard.mjs
      - name: Refresh committed KOSPI universe (robots-checked, no retry)
        id: log_step_04
        if: steps.market.outputs.should_run == 'true'
        continue-on-error: true
        run: node scripts/update-kospi-universe.mjs --candidates-csv latest
      - name: Collect after 18:00 KST for the next trading day
        id: collect
        continue-on-error: true
        if: steps.market.outputs.should_run == 'true'
        run: node scripts/collect-naver-daily.mjs --evening
      - name: Generate next-trading-day preview
        id: preview
        if: steps.market.outputs.should_run == 'true' && steps.collect.outcome == 'success' && steps.collect.outputs.target_date != ''
        continue-on-error: true
        env:
          TARGET_DATE: ${{ steps.collect.outputs.target_date }}
        run: node scripts/preview-ranking.mjs "$TARGET_DATE"
      - name: Record preview status
        id: log_step_07
        if: steps.market.outputs.should_run == 'true'
        env:
          SOURCE_DATE: ${{ steps.market.outputs.market_date }}
          PREVIEW_OUTCOME: ${{ steps.preview.outcome }}
        run: node scripts/preview-state.mjs
      - name: Save next-day history
        id: log_step_08
        if: steps.market.outputs.should_run == 'true'
        shell: bash
        env:
          TARGET_DATE: ${{ steps.collect.outputs.target_date }}
        run: |
          set -euo pipefail
          if [[ -n "$TARGET_DATE" ]]; then
            [[ "$TARGET_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
            if [[ -f "data/daily-history/$TARGET_DATE.json" ]]; then git add -- "data/daily-history/$TARGET_DATE.json"; fi
          fi
          if [[ -f data/kospi-universe.json ]]; then git add -- data/kospi-universe.json; fi
          if [[ -d data/next-preview ]]; then git add -- data/next-preview; fi
          if git diff --cached --quiet; then exit 0; fi
          bash scripts/commit-and-push.sh "chore(data): record next-day history and model $TARGET_DATE"

      - name: 작업 단계 결과 요약
        if: always()
        env:
          STEP_RESULT_01: ${{ steps.log_step_01.outcome }}|${{ steps.log_step_01.conclusion }}
          STEP_RESULT_02: ${{ steps.log_step_02.outcome }}|${{ steps.log_step_02.conclusion }}
          STEP_RESULT_03: ${{ steps.market.outcome }}|${{ steps.market.conclusion }}
          STEP_RESULT_04: ${{ steps.log_step_04.outcome }}|${{ steps.log_step_04.conclusion }}
          STEP_RESULT_05: ${{ steps.collect.outcome }}|${{ steps.collect.conclusion }}
          STEP_RESULT_06: ${{ steps.preview.outcome }}|${{ steps.preview.conclusion }}
          STEP_RESULT_07: ${{ steps.log_step_07.outcome }}|${{ steps.log_step_07.conclusion }}
          STEP_RESULT_08: ${{ steps.log_step_08.outcome }}|${{ steps.log_step_08.conclusion }}
          STEP_LABELS_BASE64: 
          CURRENT_JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          python3 - <<'PYLOG'
          import base64, json, os
          from datetime import datetime, timezone, timedelta
          labels = json.loads(base64.b64decode(os.environ['STEP_LABELS_BASE64']))
          now = datetime.now(timezone(timedelta(hours=9))).strftime('%Y-%m-%d %H:%M:%S KST')
          lines = ['### 작업 단계 결과', f"- 작업: `{os.environ.get('GITHUB_JOB', '')}` · 실행: `{os.environ.get('GITHUB_RUN_ID', '')}` · 시도: `{os.environ.get('GITHUB_RUN_ATTEMPT', '')}`", f"- 작업 상태: `{os.environ.get('CURRENT_JOB_STATUS', '')}` · 기록 시각: {now}", '', '| 단계 | 실제 결과 | 최종 판정 |', '| --- | --- | --- |']
          for i, (key, label) in enumerate(labels.items(), 1):
              outcome, conclusion = (os.environ.get(f'STEP_RESULT_{i:02}', '|') + '|').split('|')[:2]
              safe_label = label.replace('|', '/').replace('\n', ' ')
              lines.append(f"| {safe_label} | {outcome or 'skipped'} | {conclusion or 'skipped'} |")
          report = '\n'.join(lines) + '\n'
          print(report)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as output: output.write(report)
          PYLOG
