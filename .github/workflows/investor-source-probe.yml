name: "[점검 02] 매매동향 수집 가능 여부 확인"

# Manual, read-only probe: re-checks robots.txt and looks for a robots-permitted
# per-date investor-flow source and its oldest available date. Commits nothing.
on:
  workflow_dispatch:
    inputs:
      symbol:
        description: '점검 종목코드'
        type: string
        default: '005930'
        required: false
      collector_endpoint:
        description: '기존 수집기 주소(m.stock.naver.com trend)의 과거 기간 측정'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  probe:
    if: github.repository == 'kospi-signal/kospi-signal.github.io'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: 작업 및 요청 공통 기록 설정
        shell: bash
        run: |
          printf '%s\n' 'KOSPI_REQUEST_AUDIT=1' "BASH_ENV=$GITHUB_WORKSPACE/scripts/audit-env.sh" >> "$GITHUB_ENV"
      - name: 매매동향 수집 가능 여부 확인
        env:
          SYMBOL: ${{ inputs.symbol }}
          COLLECTOR: ${{ inputs.collector_endpoint }}
        run: node scripts/probe-investor-sources.mjs --symbol "${SYMBOL:-005930}" $([[ "$COLLECTOR" == true ]] && echo --collector-endpoint)
