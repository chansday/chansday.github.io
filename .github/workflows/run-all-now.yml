name: "[4 수동] 전체 단계 실행 (날짜 지정)"

on:
  workflow_dispatch:
    inputs:
      run_date:
        description: "KST trading date to process (YYYY-MM-DD)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: kospi-signal-board-pipeline
  cancel-in-progress: false

jobs:
  run-all:
    if: github.repository == 'kospi-signal/kospi-signal.github.io'
    runs-on: ubuntu-24.04
    # No timeout-minutes: a past-date reconstruction requests every symbol's
    # daily chart one by one and is allowed to finish late (GitHub's 6 h job
    # maximum still applies). Progress lines show where it is.
    env:
      KOSPI_PROVIDER: naver-crawl
      KOSPI_DAILY_HISTORY: naver-cache
      KOSPI_RUN_DATE: ${{ inputs.run_date }}
      KOSPI_RUN_ID: ${{ github.run_id }}.${{ github.run_attempt }}
      KOSPI_STABLE_SNAPSHOT: "1"
      KOSPI_MANUAL_RUN_ALL: "1"
      KOSPI_PROVIDER_API_KEY: ${{ secrets.KOSPI_PROVIDER_API_KEY }}
      KOSPI_PROVIDER_BASE_URL: ${{ secrets.KOSPI_PROVIDER_BASE_URL }}
      KOSPI_PUBLIC_SOURCE_NAME: ${{ vars.KOSPI_PUBLIC_SOURCE_NAME || '' }}
      KOSPI_PUBLIC_SOURCE_URL: ${{ vars.KOSPI_PUBLIC_SOURCE_URL || '' }}
      KOSPI_PUBLIC_SOURCE_LICENSE_STATUS: ${{ vars.KOSPI_PUBLIC_SOURCE_LICENSE_STATUS || 'unconfirmed' }}
      KOSPI_PUBLIC_SOURCE_LICENSE_URL: ${{ vars.KOSPI_PUBLIC_SOURCE_LICENSE_URL || '' }}
      KOSPI_PUBLIC_SOURCE_ALLOWED_HOSTS: ${{ vars.KOSPI_PUBLIC_SOURCE_ALLOWED_HOSTS || '' }}
    steps:
      - name: Validate run date input
        id: validate-input
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$KOSPI_RUN_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || ! date -d "$KOSPI_RUN_DATE" +%F >/dev/null 2>&1; then
            echo "::error::run_date must be a valid YYYY-MM-DD date."
            exit 1
          fi

      - name: Capture actual run start timestamp
        id: run-context
        shell: bash
        run: |
          set -euo pipefail
          run_started_at="$(date -u +'%Y-%m-%dT%H:%M:%S.%3NZ')"
          case "$run_started_at" in
            ????-??-??T??:??:??.???Z) ;;
            *) echo "Generated run-start timestamp is not ISO-8601 UTC: $run_started_at" >&2; exit 1 ;;
          esac
          echo "run_started_at=$run_started_at" >> "$GITHUB_OUTPUT"
          echo "KOSPI_RUN_STARTED_AT=$run_started_at" >> "$GITHUB_ENV"

      - name: Check out repository
        id: checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        id: setup-node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check past run dates
        id: historical-guard
        # "Today" is the KST date of the same runner-captured start run-all.mjs
        # uses. Market-closed dates pass so run-all reports market_closed; a
        # past trading day with 1530.json is re-evaluated, one without it is
        # reconstructed from daily candles (scripts/reconstruct-day.mjs).
        shell: bash
        env:
          RUN_STARTED_AT: ${{ steps.run-context.outputs.run_started_at }}
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import { existsSync } from "node:fs";
          import { classifyMarketDate, kstDate, loadMarketCalendar } from "./scripts/market-calendar.mjs";
          const runDate = process.env.KOSPI_RUN_DATE;
          const started = new Date(process.env.RUN_STARTED_AT || "");
          const fail = (message) => { console.log(`::error::${message}`); process.exitCode = 1; };
          if (Number.isNaN(started.getTime())) {
            fail("Runner start timestamp is missing or invalid; the run date cannot be checked.");
          } else {
            const today = kstDate(started);
            const settlement = `data/runs/${runDate}/1530.json`;
            if (runDate >= today) {
              console.log(`run_date ${runDate} is not before ${today} KST; run-all decides.`);
            } else if (existsSync(settlement)) {
              console.log(`${settlement} exists; run-all re-evaluates the stored settlement.`);
            } else {
              const calendar = await loadMarketCalendar();
              const market = classifyMarketDate(runDate, calendar);
              if (market.reason === "calendar_coverage_missing") {
                fail(`run_date ${runDate} is outside the checked-in KRX calendar coverage (${calendar.coverage.start}..${calendar.coverage.end}); run the '[5 관리] KRX 휴장일 갱신 (매일)' workflow (update-market-calendar.yml) first.`);
              } else if (market.status !== "run") {
                console.log(`::notice::run_date ${runDate} is not a KOSPI trading day (${market.reason}); run-all reports the market-closed result.`);
              } else {
                console.log(`::notice::run_date ${runDate} has no ${settlement}; run-all reconstructs every stage file of the date from Naver daily candles.`);
              }
            }
          }
          JS

      - name: Validate the static contract
        id: static-contract
        # Tests must not inherit the stage's live history mode; it makes fixture
        # runs read the repository's Naver daily cache and report degraded.
        env:
          KOSPI_DAILY_HISTORY: ""
        run: npm test && npm run check && npm run collection:audit && npm run check:experiment

      - name: Capture collection invocation timestamp
        id: collection-context
        shell: bash
        run: |
          set -euo pipefail
          collection_started_at="$(date -u +'%Y-%m-%dT%H:%M:%S.%3NZ')"
          case "$collection_started_at" in
            ????-??-??T??:??:??.???Z) ;;
            *) echo "Generated collection timestamp is not ISO-8601 UTC: $collection_started_at" >&2; exit 1 ;;
          esac
          echo "collection_started_at=$collection_started_at" >> "$GITHUB_OUTPUT"

      - name: Run all KOSPI stages sequentially
        id: run-all
        continue-on-error: true
        run: node scripts/run-all.mjs --run-date "$KOSPI_RUN_DATE" --run-started-at "${{ steps.run-context.outputs.run_started_at }}" --attempted-at "${{ steps.collection-context.outputs.collection_started_at }}" --run-id "$KOSPI_RUN_ID"

      - name: Save previous-result status after a failed run
        id: log_step_09
        if: always() && steps.run-all.outcome == 'failure' && steps.static-contract.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          [[ "$KOSPI_RUN_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          file="data/runs/$KOSPI_RUN_DATE/previous-result-status.json"
          if [ ! -f "$file" ]; then exit 0; fi
          bash scripts/git-add-retry.sh -- "$file"
          if git diff --cached --quiet; then exit 0; fi
          bash scripts/commit-and-push.sh "chore(data): record previous result status"

      - name: Freeze recorded pre-open ranking
        id: log_step_10
        if: steps.run-all.outcome == 'success' && steps.run-all.outputs.commit_allowed == 'true'
        continue-on-error: true
        run: node scripts/freeze-preopen-ranking.mjs "$KOSPI_RUN_DATE"

      - name: Commit final run state once
        id: commit
        if: >-
          always() && steps.run-context.outcome == 'success' && steps.checkout.outcome == 'success' &&
          steps.setup-node.outcome == 'success' && steps.static-contract.outcome == 'success' &&
          ((steps.run-all.outcome == 'success' && steps.run-all.outputs.executed_stages_ready == 'true' &&
            steps.run-all.outputs.commit_allowed == 'true' &&
            (steps.run-all.outputs.overall_status == 'ready' ||
             (steps.run-all.outputs.overall_status == 'partial' && steps.run-all.outputs.pending_only_partial == 'true'))) ||
           steps.run-all.outputs.experiment_saved == 'true' || steps.run-all.outputs.experiment_status_saved == 'true')
        shell: bash
        env:
          OPERATING_ALLOWED: ${{ steps.run-all.outcome == 'success' && steps.run-all.outputs.executed_stages_ready == 'true' && steps.run-all.outputs.commit_allowed == 'true' && (steps.run-all.outputs.overall_status == 'ready' || (steps.run-all.outputs.overall_status == 'partial' && steps.run-all.outputs.pending_only_partial == 'true')) }}
          EXPERIMENT_CANDIDATE: ${{ steps.run-all.outputs.experiment_candidate }}
          STATUS_SAVED: ${{ steps.run-all.outputs.experiment_status_saved }}
          STATUS_HASH: ${{ steps.run-all.outputs.experiment_status_hash }}
          EXPERIMENT_DATE: ${{ env.KOSPI_RUN_DATE }}
          EXPERIMENT_CANDIDATES: ${{ steps.run-all.outputs.experiment_candidates }}
          RETROSPECTIVE_STATUS: ${{ steps.run-all.outputs.retrospective_status }}
          RETROSPECTIVE_SOURCE_RUN_ID: ${{ steps.run-all.outputs.retrospective_source_run_id }}
        run: |
          set -euo pipefail
          # status, not diff: a reconstructed date adds untracked stage files.
          if [ "$OPERATING_ALLOWED" = true ] && [ -n "$(git status --porcelain -- data/latest-snapshot.json data/runs)" ]; then
            node scripts/generate-date-index.mjs
            bash scripts/git-add-retry.sh data/latest-snapshot.json data/runs data/date-index.json
          fi
          if [ "$OPERATING_ALLOWED" = true ] && [ -d data/daytrade ]; then bash scripts/git-add-retry.sh -- data/daytrade; fi
          if [ "$OPERATING_ALLOWED" = true ] && [ -d data/preopen-ranking ]; then bash scripts/git-add-retry.sh -- data/preopen-ranking; fi
          if [ "$OPERATING_ALLOWED" = true ] && [ "$RETROSPECTIVE_STATUS" = ready ]; then
            [[ "$EXPERIMENT_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
            [[ "$RETROSPECTIVE_SOURCE_RUN_ID" =~ ^[A-Za-z0-9._-]+$ ]]
            bash scripts/git-add-retry.sh -- "data/runs/$EXPERIMENT_DATE/retrospective-$RETROSPECTIVE_SOURCE_RUN_ID.json"
          fi
          bash scripts/stage-daily-experiment.sh
          if git diff --cached --quiet; then echo "No permitted changes to commit."; exit 0; fi
          bash scripts/commit-and-push.sh "chore(data): record KOSPI run all $KOSPI_RUN_DATE"

      - name: Fail when the all-stage result is not ready
        id: log_step_12
        # A failed input or historical guard already failed the job with its own error.
        if: always() && steps.validate-input.outcome != 'failure' && steps.historical-guard.outcome != 'failure'
        shell: bash
        env:
          OVERALL_REASON: ${{ steps.run-all.outputs.overall_reason }}
        run: |
          if [ "${{ steps.run-context.outcome }}" != "success" ]; then
            echo "Runner timestamp capture failed or was skipped." >&2
            exit 1
          fi
          if [ "${{ steps.checkout.outcome }}" != "success" ] || [ "${{ steps.setup-node.outcome }}" != "success" ]; then
            echo "Repository checkout or Node.js setup failed or was skipped." >&2
            exit 1
          fi
          if [ "${{ steps.static-contract.outcome }}" != "success" ]; then
            echo "Static contract validation failed or was skipped; run-all did not execute." >&2
            exit 1
          fi
          if [ "${{ steps.run-all.outcome }}" = "skipped" ]; then
            echo "Run-all stage was skipped." >&2
            exit 1
          fi
          status="${{ steps.run-all.outputs.overall_status }}"
          # run-all.mjs reports a closed market as blocked with overall_reason
          # "<classifyMarketDate reason>: ..."; only weekend and holiday kinds
          # are a successful no-op. Every other blocked reason still fails.
          if [ "$status" = "blocked" ]; then
            case "$OVERALL_REASON" in
              weekend:*|public_holiday:*|substitute_holiday:*|temporary_holiday:*|market_holiday:*)
                echo "::notice::휴장일이라 실행할 것이 없음 (${OVERALL_REASON%%:*})"
                {
                  echo "### [4 수동] 전체 단계 실행 (날짜 지정): market closed"
                  echo "- 휴장일이라 실행할 것이 없음 (\`${OVERALL_REASON%%:*}\`); no collection or snapshot write was performed."
                } >> "$GITHUB_STEP_SUMMARY"
                exit 0
                ;;
              calendar_coverage_missing:*)
                echo "::error::The KRX calendar does not cover this run date; run the '[5 관리] KRX 휴장일 갱신 (매일)' workflow (update-market-calendar.yml) first."
                ;;
            esac
          fi
          case "$status" in
            ready)
              if [ "${{ steps.run-all.outputs.executed_stages_ready }}" != "true" ] || [ "${{ steps.run-all.outputs.commit_allowed }}" != "true" ]; then
                echo "Ready overall status did not satisfy the executed-stage commit gate." >&2
                exit 1
              fi
              if [ "${{ steps.run-all.outcome }}" != "success" ]; then
                echo "Run-all step failed for status $status." >&2
                exit 1
              fi
              if [ "${{ steps.commit.outcome }}" != "success" ]; then
                echo "Final snapshot commit failed or was skipped for status $status." >&2
                exit 1
              fi
              echo "KOSPI run all result: $status."
              ;;
            partial)
              if [ "${{ steps.run-all.outputs.pending_only_partial }}" != "true" ] || [ "${{ steps.run-all.outputs.executed_stages_ready }}" != "true" ] || [ "${{ steps.run-all.outputs.commit_allowed }}" != "true" ]; then
                echo "Partial overall status is not pending-only or an executed stage was not ready." >&2
                exit 1
              fi
              if [ "${{ steps.run-all.outcome }}" != "success" ]; then
                echo "Run-all step failed for status $status." >&2
                exit 1
              fi
              if [ "${{ steps.commit.outcome }}" != "success" ]; then
                echo "Final snapshot commit failed or was skipped for status $status." >&2
                exit 1
              fi
              echo "KOSPI run all result: $status (pending stages are the only non-executed stages; every executed stage was ready)."
              ;;
            blocked|degraded|no_data)
              echo "KOSPI run all result: $status" >&2
              exit 1
              ;;
            *)
              echo "KOSPI run all returned an empty or unknown overall_status: '$status'" >&2
              exit 1
              ;;
          esac

      - name: Fail when the isolated experiment failed
        id: log_step_13
        # run-all.mjs reports experiment_status=not_run only on its early-return
        # paths (future date, market closed, historical re-evaluation); the
        # current-day path always runs the experiment and reports its status.
        if: >-
          always() && steps.static-contract.outcome == 'success' && steps.run-all.outputs.overall_status != '' &&
          steps.run-all.outputs.retrospective_historical != 'true' && steps.run-all.outputs.experiment_status != 'not_run'
        shell: bash
        env:
          EXPERIMENT_STATUS: ${{ steps.run-all.outputs.experiment_status }}
          STATUS_SAVED: ${{ steps.run-all.outputs.experiment_status_saved }}
          EXPERIMENT_CANDIDATE: ${{ steps.run-all.outputs.experiment_candidate }}
          EXPERIMENT_CANDIDATES: ${{ steps.run-all.outputs.experiment_candidates }}
          EXPERIMENT_REASON: ${{ steps.run-all.outputs.experiment_reason }}
          EXPERIMENT_NOT_APPLICABLE: ${{ steps.run-all.outputs.experiment_not_applicable }}
          EXPERIMENT_POST_CLOSE: ${{ steps.run-all.outputs.experiment_post_close }}
        run: |
          node scripts/validate-experiment-gate.mjs
          if [ "${{ steps.commit.outcome }}" != "success" ]; then
            echo "Experiment status could not be saved." >&2
            exit 1
          fi

      - name: 작업 단계 결과 요약
        if: always()
        env:
          STEP_RESULT_01: ${{ steps.validate-input.outcome }}|${{ steps.validate-input.conclusion }}
          STEP_RESULT_02: ${{ steps.run-context.outcome }}|${{ steps.run-context.conclusion }}
          STEP_RESULT_03: ${{ steps.checkout.outcome }}|${{ steps.checkout.conclusion }}
          STEP_RESULT_04: ${{ steps.setup-node.outcome }}|${{ steps.setup-node.conclusion }}
          STEP_RESULT_05: ${{ steps.historical-guard.outcome }}|${{ steps.historical-guard.conclusion }}
          STEP_RESULT_06: ${{ steps.static-contract.outcome }}|${{ steps.static-contract.conclusion }}
          STEP_RESULT_07: ${{ steps.collection-context.outcome }}|${{ steps.collection-context.conclusion }}
          STEP_RESULT_08: ${{ steps.run-all.outcome }}|${{ steps.run-all.conclusion }}
          STEP_RESULT_09: ${{ steps.log_step_09.outcome }}|${{ steps.log_step_09.conclusion }}
          STEP_RESULT_10: ${{ steps.log_step_10.outcome }}|${{ steps.log_step_10.conclusion }}
          STEP_RESULT_11: ${{ steps.commit.outcome }}|${{ steps.commit.conclusion }}
          STEP_RESULT_12: ${{ steps.log_step_12.outcome }}|${{ steps.log_step_12.conclusion }}
          STEP_RESULT_13: ${{ steps.log_step_13.outcome }}|${{ steps.log_step_13.conclusion }}
          STEP_LABELS_BASE64: 
          CURRENT_JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          python3 - <<'PYLOG'
          import base64, json, os
          from datetime import datetime, timezone, timedelta
          labels = json.loads(base64.b64decode(os.environ['STEP_LABELS_BASE64']))
          now = datetime.now(timezone(timedelta(hours=9))).strftime('%Y-%m-%d %H:%M:%S KST')
          lines = ['### 작업 단계 결과', f"- 작업: `{os.environ.get('GITHUB_JOB', '')}` · 실행: `{os.environ.get('GITHUB_RUN_ID', '')}` · 시도: `{os.environ.get('GITHUB_RUN_ATTEMPT', '')}`", f"- 작업 상태: `{os.environ.get('CURRENT_JOB_STATUS', '')}` · 기록 시각: {now}", '', '| 단계 | 실제 결과 | 최종 판정 |', '| --- | --- | --- |']
          for i, (key, label) in enumerate(labels.items(), 1):
              outcome, conclusion = (os.environ.get(f'STEP_RESULT_{i:02}', '|') + '|').split('|')[:2]
              safe_label = label.replace('|', '/').replace('\n', ' ')
              lines.append(f"| {safe_label} | {outcome or 'skipped'} | {conclusion or 'skipped'} |")
          report = '\n'.join(lines) + '\n'
          print(report)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as output: output.write(report)
          PYLOG
