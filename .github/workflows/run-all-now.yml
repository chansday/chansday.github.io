name: KOSPI run all now

on:
  workflow_dispatch:
    inputs:
      run_date:
        description: "KST trading date to process (YYYY-MM-DD)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: kospi-signal-board-pipeline
  cancel-in-progress: false

jobs:
  run-all:
    runs-on: ubuntu-latest
    env:
      KOSPI_PROVIDER: naver-crawl
      KOSPI_RUN_DATE: ${{ inputs.run_date }}
      KOSPI_RUN_ID: ${{ github.run_id }}.${{ github.run_attempt }}
      KOSPI_STABLE_SNAPSHOT: "1"
      KOSPI_PROVIDER_API_KEY: ${{ secrets.KOSPI_PROVIDER_API_KEY }}
      KOSPI_PROVIDER_BASE_URL: ${{ secrets.KOSPI_PROVIDER_BASE_URL }}
      KOSPI_PUBLIC_SOURCE_NAME: ${{ vars.KOSPI_PUBLIC_SOURCE_NAME || '' }}
      KOSPI_PUBLIC_SOURCE_URL: ${{ vars.KOSPI_PUBLIC_SOURCE_URL || '' }}
      KOSPI_PUBLIC_SOURCE_LICENSE_STATUS: ${{ vars.KOSPI_PUBLIC_SOURCE_LICENSE_STATUS || 'unconfirmed' }}
      KOSPI_PUBLIC_SOURCE_LICENSE_URL: ${{ vars.KOSPI_PUBLIC_SOURCE_LICENSE_URL || '' }}
      KOSPI_PUBLIC_SOURCE_ALLOWED_HOSTS: ${{ vars.KOSPI_PUBLIC_SOURCE_ALLOWED_HOSTS || '' }}
    steps:
      - name: Capture actual run start timestamp
        id: run-context
        shell: bash
        run: |
          run_started_at="$(date -u +'%Y-%m-%dT%H:%M:%S.%3NZ')"
          case "$run_started_at" in
            ????-??-??T??:??:??.???Z) ;;
            *) echo "Generated run-start timestamp is not ISO-8601 UTC: $run_started_at" >&2; exit 1 ;;
          esac
          echo "run_started_at=$run_started_at" >> "$GITHUB_OUTPUT"
          echo "KOSPI_RUN_STARTED_AT=$run_started_at" >> "$GITHUB_ENV"

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate the static contract
        run: npm test && npm run check && npm run collection:audit

      - name: Run all KOSPI stages sequentially
        id: run-all
        continue-on-error: true
        run: node scripts/run-all.mjs --run-date "${{ inputs.run_date }}" --run-started-at "${{ steps.run-context.outputs.run_started_at }}" --attempted-at "${{ steps.run-context.outputs.run_started_at }}" --run-id "$KOSPI_RUN_ID"

      - name: Commit final run state once
        if: always() && steps.run-all.outcome != 'skipped'
        shell: bash
        run: |
          if git diff --quiet -- data/latest-snapshot.json data/runs; then
            echo "No snapshot changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest-snapshot.json data/runs
          git commit -m "chore(data): record KOSPI run all ${{ inputs.run_date }}"
          git push

      - name: Fail when the all-stage result is not ready
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.run-all.outputs.overall_status }}" = "blocked" ] || [ "${{ steps.run-all.outputs.overall_status }}" = "degraded" ]; then
            echo "KOSPI run all result: ${{ steps.run-all.outputs.overall_status }}" >&2
            exit 1
          fi
          echo "KOSPI run all result: ${{ steps.run-all.outputs.overall_status }} (pending stages are an expected normal outcome when their cutoff has not arrived)."
