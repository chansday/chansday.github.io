name: "투자정보 수집 가능 여부 확인"
on:
  push:
    branches: [main]
    paths: ['.github/workflows/check-investor-source.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check robots and example page
        run: |
          node --input-type=module <<'NODE'
          const base='https://alphasquare.co.kr';
          const robots=await fetch(base+'/robots.txt',{headers:{'User-Agent':'kospi-signal-personal-investor-collector/1.0'},redirect:'manual',signal:AbortSignal.timeout(15000)});
          console.log('ROBOTS',robots.status,(await robots.text()).slice(0,8000));
          if(robots.status!==200 && robots.status!==404) process.exit(2);
          const r=await fetch(base+'/home/stock-summary?code=005930',{headers:{'User-Agent':'kospi-signal-personal-investor-collector/1.0'},redirect:'manual',signal:AbortSignal.timeout(15000)});
          const text=await r.text();
          console.log('PAGE',r.status,r.headers.get('content-type'),'length',text.length,'hasSymbol',text.includes('005930'),'hasTable',text.includes('투자자별 매매동향'),'hasDate',text.includes('2026-11-04'));
          console.log('SCRIPTS', [...text.matchAll(/<script[^>]+src="([^"]+)"/g)].map(x=>x[1]).slice(0,25));
          const mobile=await fetch('https://m.alphasquare.co.kr/home/stock-summary?code=005930',{headers:{'User-Agent':'kospi-signal-personal-investor-collector/1.0'},redirect:'manual',signal:AbortSignal.timeout(15000)});
          const m=await mobile.text();
          console.log('MOBILE',mobile.status,mobile.headers.get('content-type'),'length',m.length,'hasTable',m.includes('투자자별 매매동향'),'hasDate',m.includes('2026-11-04'));
          const script=[...text.matchAll(/<script[^>]+src="([^"]+)"/g)].map(x=>x[1]).find(x=>x.startsWith('/assets/index-'));
          if(script){
            const js=await (await fetch(base+script,{signal:AbortSignal.timeout(20000)})).text();
            console.log('BUNDLE_LENGTH',js.length);
            const filenames=[...new Set([...js.matchAll(/assets\/(?:StockInformation|stock-information|Investor|investor)[^"'\s,()]*?\.js/g)].map(x=>x[0]))].slice(0,10);
            for(const file of filenames){const cs=await (await fetch(base+'/'+file,{signal:AbortSignal.timeout(15000)})).text();console.log('CHUNK',file,cs.length);for(const term of ['investor','Investor','순매수','투자자']){let p=0,n=0;while((p=cs.indexOf(term,p))>=0 && n++<5){console.log('CHUNK_CTX',term,cs.slice(Math.max(0,p-160),p+260));p+=term.length}}}
            const robotsApi=await fetch('https://api.alphasquare.co.kr/robots.txt',{headers:{'User-Agent':'kospi-signal-personal-investor-collector/1.0'},redirect:'manual',signal:AbortSignal.timeout(15000)});
            const rules=await robotsApi.text(); console.log('API_ROBOTS',robotsApi.status,rules.slice(0,3000));
            if(robotsApi.status===404 || (robotsApi.status===200 && !/^disallow:\s*\/(?:\s*$|data(?:\/|\s|$))/im.test(rules))) {
              const api2=await fetch('https://api.alphasquare.co.kr/data/v2/stock/summary/005930',{headers:{Accept:'application/json','User-Agent':'kospi-signal-personal-investor-collector/1.0'},redirect:'manual',signal:AbortSignal.timeout(15000)});
              let body2=await api2.text(); console.log('SUMMARY_API',api2.status,api2.headers.get('content-type'),body2.slice(0,2200));
            } for(const term of ['iR=','iR =','API_BASE_URL','API_URL']){let pos=js.indexOf(term);if(pos>=0)console.log('CONFIG_REF',term,js.slice(Math.max(0,pos-150),pos+500));}
            const cfg=await (await fetch(base+'/runtime-config.js',{signal:AbortSignal.timeout(15000)})).text(); console.log('CONFIG_KEYS', [...cfg.matchAll(/[A-Z][A-Z_]{3,}/g)].map(x=>x[0]).slice(0,40));
            for(const term of ['baseURL:','baseURL=','/data/v2/stock/summary/']){let pos=0,k=0;while((pos=js.indexOf(term,pos))>=0 && k++<4){console.log('BASE_CTX',term,js.slice(Math.max(0,pos-200),pos+350));pos+=term.length}}
            const api=await fetch(base+'/data/v2/stock/summary/005930',{headers:{Accept:'application/json','User-Agent':'kospi-signal-personal-investor-collector/1.0'},redirect:'manual',signal:AbortSignal.timeout(15000)});
            const body=await api.text();console.log('API',api.status,api.headers.get('content-type'),body.slice(0,1000));
            for(const term of ['kx={getStockSummary','getStockSummary:','/home/stock/stock-summary']){let pos=js.indexOf(term); if(pos>=0) console.log('CONTEXT',term,js.slice(Math.max(0,pos-300),pos+2500));}
            console.log('BUNDLE_PATHS', [...new Set([...js.matchAll(/[^"'\x60\s,()]{0,100}(?:investor|Investor|stock-summary|StockSummary)[^"'\x60\s,()]{0,120}/g)].map(x=>x[0]))].slice(0,45));
            for(const term of ['investorTrade','investor-trading','investorTrend','investor','투자자별','순매수량']){
              let pos=0,count=0;
              while((pos=js.indexOf(term,pos))>=0 && count<4){console.log('BUNDLE_MATCH',term,js.slice(Math.max(0,pos-170),pos+220));pos+=term.length;count++}
            }
          }
          NODE
