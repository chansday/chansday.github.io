name: "[11 수집] 나스닥 섹터 지수"
run-name: "keeper:${{ inputs.keeper_slot }}"
on:
  workflow_dispatch:
    inputs:
      keeper_slot:
        type: string
        required: false
      phase:
        type: string
        required: false
      market_date:
        type: string
        required: false
permissions:
  contents: write
concurrency:
  group: kospi-signal-board-pipeline
  cancel-in-progress: false
jobs:
  collect:
    if: github.repository == 'kospi-signal/kospi-signal.github.io'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: 작업 및 요청 공통 기록 설정
        shell: bash
        run: |
          printf '%s\n' 'KOSPI_REQUEST_AUDIT=1' "BASH_ENV=$GITHUB_WORKSPACE/scripts/audit-env.sh" >> "$GITHUB_ENV"
      - id: market
        env:
          SCHEDULE: ${{ github.event.schedule }}
          KEEPER_PHASE: ${{ inputs.phase }}
          KEEPER_MARKET_DATE: ${{ inputs.market_date }}
        run: node scripts/us-market-calendar.mjs
      - name: 나스닥 섹터 데이터 수집
        id: collect
        if: steps.market.outputs.should_run == 'true'
        continue-on-error: true
        env:
          NASDAQ_SECTORS_PHASE: ${{ steps.market.outputs.phase }}
          NASDAQ_MARKET_DATE: ${{ steps.market.outputs.market_date }}
        run: node scripts/collect-nasdaq-sectors.mjs
      - name: 나스닥 섹터 데이터 저장
        if: always() && steps.market.outputs.should_run == 'true'
        run: |
          if [[ -d data/nasdaq-sectors ]]; then git add -- data/nasdaq-sectors; fi
          if ! git diff --cached --quiet; then bash scripts/commit-and-push.sh "chore(data): record nasdaq sector snapshot"; fi
      - name: 수집 상태 확인
        if: steps.collect.outcome == 'failure'
        run: exit 1
