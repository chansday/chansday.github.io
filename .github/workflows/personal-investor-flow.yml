name: "[개인] 투자자별 매매동향 수집"

on:
  workflow_run:
    workflows: ['[2 단계] 15:31 종가 정산']
    types: [completed]
  schedule:
    - cron: '15 11 * * 1-5' # 20:15 KST, source may publish late
  workflow_dispatch:
    inputs:
      from_date:
        description: '시작 거래일 YYYY-MM-DD (비우면 오늘)'
        type: string
        required: false
      to_date:
        description: '마지막 거래일 YYYY-MM-DD (비우면 오늘)'
        type: string
        required: false
      symbol:
        description: '종목코드 (비우면 전체 KOSPI)'
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: personal-investor-flow
  cancel-in-progress: false

jobs:
  collect:
    if: >-
      contains(fromJSON('["kospi-signal/kospi-signal.github.io", "chansday/chansday.github.io"]'), github.repository) &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        id: log_step_01
      - uses: actions/setup-node@v7
        id: log_step_02
        with:
          node-version: 22
      - id: market
        run: node scripts/market-session-guard.mjs
      - name: Collect investor flows
        id: collect
        if: >-
          github.event_name == 'workflow_dispatch' ||
          steps.market.outputs.should_run == 'true'
        continue-on-error: true
        env:
          EVENT_TYPE: ${{ github.event_name }}
          INPUT_FROM: ${{ inputs.from_date }}
          INPUT_TO: ${{ inputs.to_date }}
          INPUT_SYMBOL: ${{ inputs.symbol }}
          CLOSE_STARTED: ${{ github.event.workflow_run.created_at }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--all)
          if [[ -n "$INPUT_SYMBOL" ]]; then args=(--symbol "$INPUT_SYMBOL"); fi
          if [[ "$EVENT_TYPE" == workflow_dispatch && ( -n "$INPUT_FROM" || -n "$INPUT_TO" ) ]]; then
            [[ -n "$INPUT_FROM" && -n "$INPUT_TO" ]] || { echo 'Both dates are required.' >&2; exit 1; }
            args+=(--from "$INPUT_FROM" --to "$INPUT_TO")
          elif [[ "$EVENT_TYPE" == workflow_run ]]; then
            close_date="$(node --input-type=module -e 'import { kstDate } from "./scripts/market-calendar.mjs"; const d=new Date(process.env.CLOSE_STARTED); if (Number.isNaN(d.getTime()) || kstDate(d)!==kstDate()) process.exit(1); console.log(kstDate(d));')"
            args+=(--date "$close_date")
          fi
          node scripts/collect-investor-flow.mjs "${args[@]}"
      - name: Save investor output
        id: save
        if: always() && steps.collect.outputs.saved == 'true'
        run: |
          set -euo pipefail
          git add -- data/investor-flow
          if ! git diff --cached --quiet; then bash scripts/commit-and-push.sh "chore(data): save investor flow"; fi
      - name: Summarize source coverage
        id: log_step_06
        if: always() && steps.collect.outputs.saved == 'true'
        env:
          COLLECTION_STATUS: ${{ steps.collect.outputs.status }}
          COLLECTED: ${{ steps.collect.outputs.count }}
          REQUESTED: ${{ steps.collect.outputs.requested }}
          INCOMPLETE: ${{ steps.collect.outputs.incomplete }}
        run: |
          {
            echo "### 개인 투자자별 매매동향 수집"
            echo "- 상태: $COLLECTION_STATUS"
            echo "- 수집 종목: $COLLECTED / $REQUESTED"
            echo "- 요청 날짜 또는 주체별 값이 부족한 종목: $INCOMPLETE"
            echo "- 순매수 수량은 사이트 표시에 사용됩니다."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Report incomplete collection
        id: log_step_07
        if: always() && steps.collect.outcome == 'failure'
        run: |
          echo "Collection did not complete; any collected portion was preserved when available." >&2
          exit 1
      - name: 작업 단계 결과 요약
        if: always()
        env:
          STEP_RESULT_01: ${{ steps.log_step_01.outcome }}|${{ steps.log_step_01.conclusion }}
          STEP_RESULT_02: ${{ steps.log_step_02.outcome }}|${{ steps.log_step_02.conclusion }}
          STEP_RESULT_03: ${{ steps.market.outcome }}|${{ steps.market.conclusion }}
          STEP_RESULT_04: ${{ steps.collect.outcome }}|${{ steps.collect.conclusion }}
          STEP_RESULT_05: ${{ steps.save.outcome }}|${{ steps.save.conclusion }}
          STEP_RESULT_06: ${{ steps.log_step_06.outcome }}|${{ steps.log_step_06.conclusion }}
          STEP_RESULT_07: ${{ steps.log_step_07.outcome }}|${{ steps.log_step_07.conclusion }}
          STEP_LABELS_BASE64: 
          CURRENT_JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          python3 - <<'PYLOG'
          import base64, json, os
          from datetime import datetime, timezone, timedelta
          labels = json.loads(base64.b64decode(os.environ['STEP_LABELS_BASE64']))
          now = datetime.now(timezone(timedelta(hours=9))).strftime('%Y-%m-%d %H:%M:%S KST')
          lines = ['### 작업 단계 결과', f"- 작업: `{os.environ.get('GITHUB_JOB', '')}` · 실행: `{os.environ.get('GITHUB_RUN_ID', '')}` · 시도: `{os.environ.get('GITHUB_RUN_ATTEMPT', '')}`", f"- 작업 상태: `{os.environ.get('CURRENT_JOB_STATUS', '')}` · 기록 시각: {now}", '', '| 단계 | 실제 결과 | 최종 판정 |', '| --- | --- | --- |']
          for i, (key, label) in enumerate(labels.items(), 1):
              outcome, conclusion = (os.environ.get(f'STEP_RESULT_{i:02}', '|') + '|').split('|')[:2]
              safe_label = label.replace('|', '/').replace('\n', ' ')
              lines.append(f"| {safe_label} | {outcome or 'skipped'} | {conclusion or 'skipped'} |")
          report = '\n'.join(lines) + '\n'
          print(report)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as output: output.write(report)
          PYLOG
