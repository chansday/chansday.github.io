name: "[08 매매동향] 외국인·개인·기관 수집"

on:
  workflow_call:
  schedule:
    - cron: '47 11 * * 1-5' # 20:47 KST: observed complete run on 2026-11-03
    - cron: '30 22 * * 0-5' # 07:30 KST: retry a missing recent trading day
  workflow_dispatch:
    inputs:
      from_date:
        description: '시작 거래일 YYYY-MM-DD (비우면 오늘)'
        type: string
        required: false
      to_date:
        description: '마지막 거래일 YYYY-MM-DD (비우면 오늘)'
        type: string
        required: false
      symbol:
        description: '종목코드 (비우면 전체 KOSPI)'
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: personal-investor-flow
  cancel-in-progress: false

jobs:
  collect:
    if: github.repository == 'kospi-signal/kospi-signal.github.io'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        id: log_step_01
      - uses: actions/setup-node@v7
        id: log_step_02
        with:
          node-version: 22
      - name: 작업 및 요청 공통 기록 설정
        shell: bash
        run: |
          printf '%s\n' 'KOSPI_REQUEST_AUDIT=1' "BASH_ENV=$GITHUB_WORKSPACE/scripts/audit-env.sh" >> "$GITHUB_ENV"
      - id: market
        run: node scripts/market-session-guard.mjs
      - name: 실행 시간 및 누락 날짜 확인
        id: window
        env:
          EVENT_TYPE: ${{ github.event_name }}
          TRADING_DAY: ${{ steps.market.outputs.should_run }}
        run: |
          set -euo pipefail
          now_kst=$(TZ=Asia/Seoul date +%H%M)
          if [[ "$EVENT_TYPE" != 'schedule' ]]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          elif [[ "$now_kst" < '1200' ]]; then
            target=$(node --input-type=module -e 'import {existsSync} from "node:fs"; import {previousTradingDate} from "./scripts/previous-result.mjs"; import {kstDate,loadMarketCalendar} from "./scripts/market-calendar.mjs"; const calendar=await loadMarketCalendar(); let day=kstDate(), missing=[]; for(let i=0;i<5;i++){day=previousTradingDate(day,calendar); if(!existsSync(`data/investor-flow/${day}.json`)) missing.push(day)} console.log(missing.at(-1)||"")')
            echo "target_date=$target" >> "$GITHUB_OUTPUT"
            if [[ -z "$target" ]]; then
              echo "allowed=false" >> "$GITHUB_OUTPUT"
              echo "The five most recent trading days already have files; skipping."
            else
              echo "allowed=true" >> "$GITHUB_OUTPUT"
              echo "Collecting missing recent trading day $target."
            fi
          elif [[ "$now_kst" > '2046' && "$TRADING_DAY" == 'true' ]]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "Scheduled run outside the collection window ($now_kst KST); skipping."
          fi
      - name: 투자자별 매매동향 수집
        id: collect
        if: >-
          steps.window.outputs.allowed == 'true'
        continue-on-error: true
        env:
          EVENT_TYPE: ${{ github.event_name }}
          INPUT_FROM: ${{ inputs.from_date }}
          INPUT_TO: ${{ inputs.to_date }}
          INPUT_SYMBOL: ${{ inputs.symbol }}
          TARGET_DATE: ${{ steps.window.outputs.target_date }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--all)
          if [[ -n "$INPUT_SYMBOL" ]]; then args=(--symbol "$INPUT_SYMBOL"); fi
          if [[ "$EVENT_TYPE" == workflow_dispatch && ( -n "$INPUT_FROM" || -n "$INPUT_TO" ) ]]; then
            [[ -n "$INPUT_FROM" && -n "$INPUT_TO" ]] || { echo 'Both dates are required.' >&2; exit 1; }
            args+=(--from "$INPUT_FROM" --to "$INPUT_TO")
          elif [[ "$EVENT_TYPE" == schedule && -n "$TARGET_DATE" ]]; then
            args+=(--date "$TARGET_DATE")
          fi
          node scripts/collect-investor-flow.mjs "${args[@]}"
      - name: 매매동향 저장
        id: save
        if: always() && steps.collect.outputs.saved == 'true'
        run: |
          set -euo pipefail
          git add -- data/investor-flow
          if ! git diff --cached --quiet; then bash scripts/commit-and-push.sh "chore(data): save investor flow"; fi
      - name: 수집 건수·누락 요약
        id: log_step_06
        if: always() && steps.collect.outputs.saved == 'true'
        env:
          COLLECTION_STATUS: ${{ steps.collect.outputs.status }}
          COLLECTED: ${{ steps.collect.outputs.count }}
          REQUESTED: ${{ steps.collect.outputs.requested }}
          INCOMPLETE: ${{ steps.collect.outputs.incomplete }}
        run: |
          {
            echo "### 개인 투자자별 매매동향 수집"
            echo "- 상태: $COLLECTION_STATUS"
            echo "- 수집 종목: $COLLECTED / $REQUESTED"
            echo "- 요청 날짜 또는 주체별 값이 부족한 종목: $INCOMPLETE"
            echo "- 순매수 수량은 사이트 표시에 사용됩니다."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 수집 완료 여부 확인
        id: log_step_07
        if: always() && (steps.collect.outcome == 'failure' || steps.collect.outputs.status == 'not_published' || steps.collect.outputs.status == 'partial')
        run: |
          echo "Collection did not complete; any collected portion was preserved when available." >&2
          exit 1
      - name: 작업 단계 결과 요약
        if: always()
        env:
          STEP_RESULT_01: ${{ steps.log_step_01.outcome }}|${{ steps.log_step_01.conclusion }}
          STEP_RESULT_02: ${{ steps.log_step_02.outcome }}|${{ steps.log_step_02.conclusion }}
          STEP_RESULT_03: ${{ steps.market.outcome }}|${{ steps.market.conclusion }}
          STEP_RESULT_04: ${{ steps.collect.outcome }}|${{ steps.collect.conclusion }}
          STEP_RESULT_05: ${{ steps.save.outcome }}|${{ steps.save.conclusion }}
          STEP_RESULT_06: ${{ steps.log_step_06.outcome }}|${{ steps.log_step_06.conclusion }}
          STEP_RESULT_07: ${{ steps.log_step_07.outcome }}|${{ steps.log_step_07.conclusion }}
          STEP_LABELS_BASE64: 
          CURRENT_JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          python3 - <<'PYLOG'
          import base64, json, os
          from datetime import datetime, timezone, timedelta
          labels = json.loads(base64.b64decode(os.environ['STEP_LABELS_BASE64']))
          now = datetime.now(timezone(timedelta(hours=9))).strftime('%Y-%m-%d %H:%M:%S KST')
          lines = ['### 작업 단계 결과', f"- 작업: `{os.environ.get('GITHUB_JOB', '')}` · 실행: `{os.environ.get('GITHUB_RUN_ID', '')}` · 시도: `{os.environ.get('GITHUB_RUN_ATTEMPT', '')}`", f"- 작업 상태: `{os.environ.get('CURRENT_JOB_STATUS', '')}` · 기록 시각: {now}", '', '| 단계 | 실제 결과 | 최종 판정 |', '| --- | --- | --- |']
          for i, (key, label) in enumerate(labels.items(), 1):
              outcome, conclusion = (os.environ.get(f'STEP_RESULT_{i:02}', '|') + '|').split('|')[:2]
              safe_label = label.replace('|', '/').replace('\n', ' ')
              lines.append(f"| {safe_label} | {outcome or 'skipped'} | {conclusion or 'skipped'} |")
          report = '\n'.join(lines) + '\n'
          print(report)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as output: output.write(report)
          PYLOG
