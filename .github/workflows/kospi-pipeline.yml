name: KOSPI signal board pipeline

on:
  schedule:
    # GitHub Actions cron is UTC. These five entries are Mon-Fri in KST.
    - cron: "0 22 * * 0-4" # 07:00 KST, previous-day result update
    - cron: "0 23 * * 0-4" # 08:00 KST, same-day analysis
    - cron: "20 23 * * 0-4" # 08:20 KST, pre-market collection with 08:29 KST hard deadline
    - cron: "0 0 * * 1-5" # 09:00 KST, actual_open settlement
    - cron: "30 6 * * 1-5" # 15:30 KST, same-day close settlement
  workflow_dispatch:
    inputs:
      stage:
        description: "Pipeline stage to run"
        required: true
        default: all
        type: choice
        options:
          - all
          - update-results
          - analysis
          - forecast
          - open-settlement
          - close-settlement
      provider:
        description: "Provider for this manual run only"
        required: true
        default: none
        type: choice
        options:
          - none
          - fixture
          - demo
          - public-json
          - public-csv
      fixture_date:
        description: "Synthetic fixture date when provider=fixture"
        required: true
        default: "2026-10-23"
        type: choice
        options:
          - "2026-10-22"
          - "2026-10-23"

permissions:
  contents: write

concurrency:
  group: kospi-signal-board-pipeline
  cancel-in-progress: false

jobs:
  update-snapshot:
    runs-on: ubuntu-latest
    env:
      # Public CSV is the only default provider. It uses no secrets and only
      # the explicit allowlisted bulk CSV source; pre-market fields stay null.
      KOSPI_PROVIDER: ${{ github.event_name == 'workflow_dispatch' && inputs.provider || vars.KOSPI_PROVIDER || 'public-csv' }}
      KOSPI_FIXTURE_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.fixture_date || '' }}
      KOSPI_PROVIDER_API_KEY: ${{ secrets.KOSPI_PROVIDER_API_KEY }}
      KOSPI_PROVIDER_BASE_URL: ${{ secrets.KOSPI_PROVIDER_BASE_URL }}
      KOSPI_PUBLIC_SOURCE_NAME: ${{ vars.KOSPI_PUBLIC_SOURCE_NAME || '' }}
      KOSPI_PUBLIC_SOURCE_URL: ${{ vars.KOSPI_PUBLIC_SOURCE_URL || '' }}
      KOSPI_PUBLIC_SOURCE_LICENSE_STATUS: ${{ vars.KOSPI_PUBLIC_SOURCE_LICENSE_STATUS || 'unconfirmed' }}
      KOSPI_PUBLIC_SOURCE_LICENSE_URL: ${{ vars.KOSPI_PUBLIC_SOURCE_LICENSE_URL || '' }}
      KOSPI_PUBLIC_SOURCE_ALLOWED_HOSTS: ${{ vars.KOSPI_PUBLIC_SOURCE_ALLOWED_HOSTS || '' }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Guard KOSPI trading day
        id: market-day
        run: node scripts/market-session-guard.mjs

      - name: Validate the static contract
        if: steps.market-day.outputs.should_run == 'true'
        run: npm test && npm run check

      - name: Resolve scheduled stage
        id: stage
        if: steps.market-day.outputs.should_run == 'true'
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "${{ github.event.schedule }}" in
              "0 22 * * 0-4") echo "stage=update-results" >> "$GITHUB_OUTPUT" ;;
              "0 23 * * 0-4") echo "stage=analysis" >> "$GITHUB_OUTPUT" ;;
              "20 23 * * 0-4") echo "stage=forecast" >> "$GITHUB_OUTPUT" ;;
              "0 0 * * 1-5") echo "stage=open-settlement" >> "$GITHUB_OUTPUT" ;;
              "30 6 * * 1-5") echo "stage=close-settlement" >> "$GITHUB_OUTPUT" ;;
              *) echo "Unknown schedule: ${{ github.event.schedule }}" >&2; exit 1 ;;
            esac
          else
            echo "stage=${{ inputs.stage }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run previous-day result update
        if: steps.market-day.outputs.should_run == 'true' && (steps.stage.outputs.stage == 'update-results' || steps.stage.outputs.stage == 'all')
        run: node scripts/update-results.mjs --mode update-results

      - name: Run same-day analysis
        if: steps.market-day.outputs.should_run == 'true' && (steps.stage.outputs.stage == 'analysis' || steps.stage.outputs.stage == 'all')
        run: node scripts/update-results.mjs --mode analysis

      - name: Generate pre-market forecast ranking
        if: steps.market-day.outputs.should_run == 'true' && (steps.stage.outputs.stage == 'forecast' || steps.stage.outputs.stage == 'all')
        run: node scripts/update-results.mjs --mode forecast

      - name: Settle 09:00 actual open
        if: steps.market-day.outputs.should_run == 'true' && (steps.stage.outputs.stage == 'open-settlement' || steps.stage.outputs.stage == 'all')
        run: node scripts/update-results.mjs --mode open-settlement

      - name: Settle same-day close result
        if: steps.market-day.outputs.should_run == 'true' && (steps.stage.outputs.stage == 'close-settlement' || steps.stage.outputs.stage == 'all')
        run: node scripts/update-results.mjs --mode close-settlement

      - name: Commit snapshot state when changed
        if: steps.market-day.outputs.should_run == 'true'
        shell: bash
        run: |
          if git diff --quiet -- data/latest-snapshot.json data/runs; then
            echo "No snapshot changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest-snapshot.json data/runs
          git commit -m "chore(data): record KOSPI pipeline stage"
          git push

