name: KOSPI analysis

on:
  schedule:
    - cron: "0 23 * * 0-4"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analysis:
    uses: ./.github/workflows/_run-stage.yml
    with:
      stage: analysis
      provider: naver-crawl
      run_id: ${{ github.run_id }}
      run_attempt: ${{ github.run_attempt }}
    secrets: inherit
