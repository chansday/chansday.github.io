name: "[복구 01] 누락된 종가 결과 보충"

on:
  # Started by scheduler-keeper.yml (workflow_dispatch) at 09:30 KST or later,
  # after every earlier stage of the day has finished, only when a recent past
  # trading day has a 0900/0835 (or legacy 0820) file but no 1530.json. No schedule cron.
  workflow_dispatch:
    inputs:
      run_date:
        description: "Past KOSPI trading date(s) YYYY-MM-DD, comma-separated; empty settles every missing date of the last 5 trading days"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: kospi-signal-board-pipeline
  cancel-in-progress: false

jobs:
  catch-up:
    if: github.repository == 'kospi-signal/kospi-signal.github.io'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      KOSPI_RUN_ID: ${{ github.run_id }}.${{ github.run_attempt }}
      # The input reaches the script only through the environment, never
      # through shell interpolation.
      KOSPI_CATCH_UP_DATES: ${{ inputs.run_date }}
    steps:
      - name: 저장소 내려받기
        id: checkout
        uses: actions/checkout@v7

      - name: Node.js 환경 준비
        id: setup-node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: 작업 및 요청 공통 기록 설정
        shell: bash
        run: |
          printf '%s\n' 'KOSPI_REQUEST_AUDIT=1' "BASH_ENV=$GITHUB_WORKSPACE/scripts/audit-env.sh" >> "$GITHUB_ENV"

      - name: Validate the static contract
        id: static-contract
        # Tests must not inherit any stage or catch-up mode from the job.
        env:
          KOSPI_DAILY_HISTORY: ""
          KOSPI_CATCH_UP_DATES: ""
        run: npm test && npm run check && npm run check:experiment

      - name: 누락된 종가 결과 보충
        id: catch-up
        # Eligibility is checked per date D (past KOSPI trading day within the
        # last 5 trading days); today may be any day, so a manual run on a
        # weekend can still settle Friday.
        if: steps.static-contract.outcome == 'success'
        continue-on-error: true
        run: node scripts/close-catch-up.mjs

      - name: 보충한 결과 저장
        id: commit
        if: >-
          always() &&
          steps.static-contract.outcome == 'success' &&
          steps.catch-up.outputs.wrote == 'true'
        shell: bash
        run: |
          set -euo pipefail
          changes="$(git status --short -- data/runs data/date-index.json data/latest-snapshot.json)"
          if [ -z "$changes" ]; then
            echo "No catch-up changes to commit."
            exit 0
          fi
          git add -- data/runs data/date-index.json data/latest-snapshot.json
          bash scripts/commit-and-push.sh "chore(data): record KOSPI close-settlement catch-up"

      - name: Fail when the catch-up is not ready
        id: log_step_06
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.checkout.outcome }}" != "success" ] || [ "${{ steps.setup-node.outcome }}" != "success" ]; then
            echo "Checkout or Node.js setup failed." >&2
            exit 1
          fi
          if [ "${{ steps.static-contract.outcome }}" != "success" ]; then
            echo "Static contract validation failed." >&2
            exit 1
          fi
          status="${{ steps.catch-up.outputs.status }}"
          if [ "$status" != "ready" ] && [ "$status" != "not_needed" ]; then
            echo "Catch-up did not return ready/not_needed: '$status' (step: ${{ steps.catch-up.outcome }})." >&2
            exit 1
          fi
          if [ "${{ steps.catch-up.outputs.wrote }}" = "true" ] && [ "${{ steps.commit.outcome }}" != "success" ]; then
            echo "Catch-up commit failed or was skipped." >&2
            exit 1
          fi
          if [ "${{ steps.catch-up.outputs.retrospective }}" = "failed" ]; then
            echo "Settlement recorded, but the post-close retrospective failed (see summary)." >&2
            exit 1
          fi

      - name: 작업 단계 결과 요약
        if: always()
        env:
          STEP_RESULT_01: ${{ steps.checkout.outcome }}|${{ steps.checkout.conclusion }}
          STEP_RESULT_02: ${{ steps.setup-node.outcome }}|${{ steps.setup-node.conclusion }}
          STEP_RESULT_03: ${{ steps.static-contract.outcome }}|${{ steps.static-contract.conclusion }}
          STEP_RESULT_04: ${{ steps.catch-up.outcome }}|${{ steps.catch-up.conclusion }}
          STEP_RESULT_05: ${{ steps.commit.outcome }}|${{ steps.commit.conclusion }}
          STEP_RESULT_06: ${{ steps.log_step_06.outcome }}|${{ steps.log_step_06.conclusion }}
          STEP_LABELS_BASE64: 
          CURRENT_JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          python3 - <<'PYLOG'
          import base64, json, os
          from datetime import datetime, timezone, timedelta
          labels = json.loads(base64.b64decode(os.environ['STEP_LABELS_BASE64']))
          now = datetime.now(timezone(timedelta(hours=9))).strftime('%Y-%m-%d %H:%M:%S KST')
          lines = ['### 작업 단계 결과', f"- 작업: `{os.environ.get('GITHUB_JOB', '')}` · 실행: `{os.environ.get('GITHUB_RUN_ID', '')}` · 시도: `{os.environ.get('GITHUB_RUN_ATTEMPT', '')}`", f"- 작업 상태: `{os.environ.get('CURRENT_JOB_STATUS', '')}` · 기록 시각: {now}", '', '| 단계 | 실제 결과 | 최종 판정 |', '| --- | --- | --- |']
          for i, (key, label) in enumerate(labels.items(), 1):
              outcome, conclusion = (os.environ.get(f'STEP_RESULT_{i:02}', '|') + '|').split('|')[:2]
              safe_label = label.replace('|', '/').replace('\n', ' ')
              lines.append(f"| {safe_label} | {outcome or 'skipped'} | {conclusion or 'skipped'} |")
          report = '\n'.join(lines) + '\n'
          print(report)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as output: output.write(report)
          PYLOG
