name: "[관리] 미국 거래일·휴장일 갱신"
on:
  schedule:
    - cron: '15 18 * * *' # 매일 03:15 KST
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Check without changing the calendar"
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: kospi-us-market-calendar
  cancel-in-progress: false
jobs:
  update:
    if: github.repository == 'kospi-signal/kospi-signal.github.io'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: 작업 및 요청 공통 기록 설정
        shell: bash
        run: |
          printf '%s\n' 'KOSPI_REQUEST_AUDIT=1' "BASH_ENV=$GITHUB_WORKSPACE/scripts/audit-env.sh" >> "$GITHUB_ENV"
      - name: 미국 휴장일 확인
        env:
          US_CALENDAR_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: node scripts/update-us-market-calendar.mjs
      - name: 미국 달력 검증
        run: node --test tests/us-market-calendar.test.mjs
      - name: 달력 저장
        run: |
          if git diff --quiet -- data/us-market-calendar.json; then exit 0; fi
          git add -- data/us-market-calendar.json
          bash scripts/commit-and-push.sh "chore(data): update US market calendar"
