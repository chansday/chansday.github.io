name: KOSPI forecast

on:
  schedule:
    - cron: "20 23 * * 0-4"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  forecast:
    uses: ./.github/workflows/_run-stage.yml
    with:
      stage: forecast
      provider: naver-crawl
      run_started_at: ${{ github.run_started_at }}
      run_id: ${{ github.run_id }}
      run_attempt: ${{ github.run_attempt }}
    secrets: inherit
