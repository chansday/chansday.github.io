name: KOSPI run now

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-now:
    uses: ./.github/workflows/_run-stage.yml
    with:
      auto_stage: true
      provider: naver-crawl
      run_id: ${{ github.run_id }}
      run_attempt: ${{ github.run_attempt }}
    secrets: inherit
