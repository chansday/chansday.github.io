name: "일회성 2026-11-04 매매동향 복구"
on:
  push:
    branches: [main]
    paths: ['.github/workflows/recover-investor-20261104.yml']
permissions:
  contents: write
concurrency:
  group: kospi-signal-board-pipeline
  cancel-in-progress: false
jobs:
  recover:
    if: github.repository == 'kospi-signal/kospi-signal.github.io'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Collect target date using historical page
        id: collect
        continue-on-error: true
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {readFile,appendFile} from 'node:fs/promises';
          import {collectInvestorFlow,saveInvestorDays} from './scripts/collect-investor-flow.mjs';
          const symbols=JSON.parse(await readFile('data/kospi-universe.json','utf8')).symbols.map(x=>x.symbol);
          const fetchImpl=(url,options)=>fetch(url+'?pageSize=60&bizdate=20261105',options);
          const result=await collectInvestorFlow(symbols,{startDate:'2026-11-04',endDate:'2026-11-04',expectedDates:['2026-11-04'],fetchImpl});
          const saved=result.status!=='not_published';
          if(saved) await saveInvestorDays(result);
          await appendFile(process.env.GITHUB_OUTPUT, 'saved='+saved+'\nstatus='+result.status+'\n');
          if(result.failures.length || !saved) process.exitCode=2;
          NODE
      - name: Save recovered data
        if: always() && steps.collect.outputs.saved == 'true'
        run: |
          git add -- data/investor-flow/2026-11-04.json
          if ! git diff --cached --quiet; then bash scripts/commit-and-push.sh "chore(data): recover investor flow 2026-11-04"; fi
      - name: Report collection outcome
        if: always() && steps.collect.outcome == 'failure'
        run: exit 1
