name: "[09 시황] 시장 환경 정보 수집"
run-name: "keeper:${{ inputs.keeper_slot }}"
on:
  workflow_dispatch:
    inputs:
      keeper_slot:
        type: string
        required: false
      phase:
        type: string
        required: false

permissions:
  contents: write
concurrency:
  group: kospi-signal-board-pipeline
  cancel-in-progress: false
jobs:
  collect:
    if: github.repository == 'kospi-signal/kospi-signal.github.io'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: 작업 및 요청 공통 기록 설정
        shell: bash
        run: |
          printf '%s\n' 'KOSPI_REQUEST_AUDIT=1' "BASH_ENV=$GITHUB_WORKSPACE/scripts/audit-env.sh" >> "$GITHUB_ENV"
      - id: market
        run: node scripts/market-session-guard.mjs
      - name: 시장 환경 정보 수집
        id: collect
        if: steps.market.outputs.should_run == 'true'
        continue-on-error: true
        env:
          SCHEDULE: ${{ github.event.schedule }}
          KEEPER_PHASE: ${{ inputs.phase }}
        run: |
          # A local dispatch (act) pre-sets MARKET_CONTEXT_PHASE via --env to
          # label the stage; SCHEDULE is only populated for GitHub's own cron
          # trigger, so leave an explicit phase alone instead of overwriting
          # it with "manual".
          if [ -n "${KEEPER_PHASE:-}" ]; then export MARKET_CONTEXT_PHASE="$KEEPER_PHASE"; fi
          if [ -z "${MARKET_CONTEXT_PHASE:-}" ]; then
            case "$SCHEDULE" in
              '30 22 * * 0-4') export MARKET_CONTEXT_PHASE=morning ;;
              '20 23 * * 0-4') export MARKET_CONTEXT_PHASE=preopen ;;
              '40 7 * * 1-5') export MARKET_CONTEXT_PHASE=after_close ;;
              *) export MARKET_CONTEXT_PHASE=manual ;;
            esac
          fi
          node scripts/collect-market-context.mjs
      - name: 시장 정보 저장
        if: always() && steps.market.outputs.should_run == 'true'
        run: |
          if [[ -d data/market-context ]]; then git add -- data/market-context; fi
          if [[ -d data/risk-index ]]; then git add -- data/risk-index; fi
          if [[ -d data/risk-status ]]; then git add -- data/risk-status; fi
          if ! git diff --cached --quiet; then bash scripts/commit-and-push.sh "chore(data): record market context"; fi
      - name: 수집 실패 여부 확인
        if: steps.collect.outcome == 'failure'
        run: exit 1
