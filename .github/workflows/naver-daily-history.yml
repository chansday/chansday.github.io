name: KOSPI prior daily history

on:
  # Started by scheduler-keeper.yml at 06:10 KST, with one retry at 07:10 KST
  # after a failure (last start 07:45). A complete file is preserved on rerun.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kospi-signal-board-pipeline
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - id: market
        run: node scripts/market-session-guard.mjs
      - name: Refresh committed KOSPI universe (robots-checked, no retry)
        if: steps.market.outputs.should_run == 'true'
        continue-on-error: true
        run: node scripts/update-kospi-universe.mjs --candidates-csv latest
      - name: Collect before 08:00 KST
        if: steps.market.outputs.should_run == 'true'
        run: node scripts/collect-naver-daily.mjs
      - name: Save date-specific history
        if: steps.market.outputs.should_run == 'true'
        shell: bash
        env:
          MARKET_DATE: ${{ steps.market.outputs.market_date }}
        run: |
          set -euo pipefail
          [[ "$MARKET_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          git add -- "data/daily-history/$MARKET_DATE.json"
          if [[ -f data/kospi-universe.json ]]; then git add -- data/kospi-universe.json; fi
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): record prior daily history $MARKET_DATE"
          git push
