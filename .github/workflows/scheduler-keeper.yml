name: "[관리 01] 자동 실행 스케줄러"

# The keeper stays alive between trading days (scripts/scheduler-keeper.mjs,
# stayAlive) and relays itself before the runner limit, so the schedule does
# not depend on GitHub cron starts; the crons below only restart it if the
# relay chain breaks (they queue behind a running keeper).

# Dispatches the stage workflows at their KST times (06:10 history, 07:00
# update-results, 08:00 analysis, 08:35 forecast, 09:00 open-settlement,
# 15:31 close-settlement; 09:30+ close-catch-up only when a recent past trading
# day lacks 1530.json) because GitHub schedule events were observed 3-6 h
# late. workflow_dispatch from GITHUB_TOKEN creates runs; no PAT or secret.
# Several cron starts ensure one keeper begins before 06:10 even when delayed;
# later ones resume remaining stages if a keeper died. Only one keeper runs at a
# time; duplicate stages are prevented by checking today's runs via the API.
on:
  schedule:
    - cron: "7 15 * * 0-4"  # 00:07 KST Mon-Fri
    - cron: "37 16 * * 0-4" # 01:37 KST
    - cron: "7 18 * * 0-4"  # 03:07 KST
    - cron: "37 19 * * 0-4" # 04:37 KST
    - cron: "27 20 * * 0-4" # 05:27 KST
    - cron: "37 22 * * 0-4" # 07:37 KST resume
    - cron: "7 1 * * 1-5"   # 10:07 KST resume
    - cron: "7 4 * * 1-5"   # 13:07 KST resume
    - cron: "47 5 * * 1-5"  # 14:47 KST resume
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: kospi-scheduler-keeper
  cancel-in-progress: false

jobs:
  keep:
    if: github.repository == 'kospi-signal/kospi-signal.github.io'
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v7
        id: log_step_01
        with:
          sparse-checkout: |
            scripts/
            data/krx-market-holidays.json
            providers/progress-log.js
            providers/request-audit.js
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        id: log_step_02
        with:
          node-version: 22
      - name: 작업 및 요청 공통 기록 설정
        shell: bash
        run: |
          printf '%s\n' 'KOSPI_REQUEST_AUDIT=1' "BASH_ENV=$GITHUB_WORKSPACE/scripts/audit-env.sh" >> "$GITHUB_ENV"
      - name: 예정 작업 실행 및 스케줄러 유지
        id: log_step_03
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/scheduler-keeper.mjs

      - name: 작업 단계 결과 요약
        if: always()
        env:
          STEP_RESULT_01: ${{ steps.log_step_01.outcome }}|${{ steps.log_step_01.conclusion }}
          STEP_RESULT_02: ${{ steps.log_step_02.outcome }}|${{ steps.log_step_02.conclusion }}
          STEP_RESULT_03: ${{ steps.log_step_03.outcome }}|${{ steps.log_step_03.conclusion }}
          STEP_LABELS_BASE64: eyJsb2dfc3RlcF8wMSI6IuyggOyepeyGjCDrgrTroKTrsJvquLAiLCJsb2dfc3RlcF8wMiI6Ik5vZGUuanMg7ZmY6rK9IOykgOu5hCIsImxvZ19zdGVwXzAzIjoi7JiI7KCVIOyekeyXhSDsi6Ttlokg67CPIOyKpOy8gOykhOufrCDsnKDsp4AifQ==
          CURRENT_JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          python3 - <<'PYLOG'
          import base64, json, os
          from datetime import datetime, timezone, timedelta
          labels = json.loads(base64.b64decode(os.environ['STEP_LABELS_BASE64']))
          now = datetime.now(timezone(timedelta(hours=9))).strftime('%Y-%m-%d %H:%M:%S KST')
          lines = ['### 작업 단계 결과', f"- 작업: `{os.environ.get('GITHUB_JOB', '')}` · 실행: `{os.environ.get('GITHUB_RUN_ID', '')}` · 시도: `{os.environ.get('GITHUB_RUN_ATTEMPT', '')}`", f"- 작업 상태: `{os.environ.get('CURRENT_JOB_STATUS', '')}` · 기록 시각: {now}", '', '| 단계 | 실제 결과 | 최종 판정 |', '| --- | --- | --- |']
          for i, (key, label) in enumerate(labels.items(), 1):
              outcome, conclusion = (os.environ.get(f'STEP_RESULT_{i:02}', '|') + '|').split('|')[:2]
              safe_label = label.replace('|', '/').replace('\n', ' ')
              lines.append(f"| {safe_label} | {outcome or 'skipped'} | {conclusion or 'skipped'} |")
          report = '\n'.join(lines) + '\n'
          print(report)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as output: output.write(report)
          PYLOG
