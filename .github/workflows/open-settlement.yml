name: KOSPI open-settlement

on:
  schedule:
    - cron: "0 0 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  open-settlement:
    uses: ./.github/workflows/_run-stage.yml
    with:
      stage: open-settlement
      provider: naver-crawl
      run_started_at: ${{ github.run_started_at }}
      run_id: ${{ github.run_id }}
      run_attempt: ${{ github.run_attempt }}
    secrets: inherit
