name: "[2 단계] 15:31 종가 정산"

on:
  # Started by scheduler-keeper.yml (workflow_dispatch) at its KST time; the
  # former schedule cron was removed so a 3-6 h late schedule run cannot repeat
  # the stage outside its window and overwrite the stage file.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  close-settlement:
    if: github.repository == 'kospi-signal/kospi-signal.github.io'
    uses: ./.github/workflows/_run-stage.yml
    with:
      stage: close-settlement
      provider: naver-crawl
      run_id: ${{ github.run_id }}
      run_attempt: ${{ github.run_attempt }}
    secrets:
      KOSPI_PROVIDER_API_KEY: ${{ secrets.KOSPI_PROVIDER_API_KEY }}
      KOSPI_PROVIDER_BASE_URL: ${{ secrets.KOSPI_PROVIDER_BASE_URL }}

  # Investor flows of the same day, right after a successful close settlement
  # (replaces the former workflow_run trigger, whose name filter did not match).
  investor-flow:
    needs: close-settlement
    if: github.repository == 'kospi-signal/kospi-signal.github.io' && needs.close-settlement.result == 'success'
    uses: ./.github/workflows/personal-investor-flow.yml
    with:
      chained: true
