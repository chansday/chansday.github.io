name: KOSPI close-settlement

on:
  schedule:
    - cron: "30 6 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  close-settlement:
    uses: ./.github/workflows/_run-stage.yml
    with:
      stage: close-settlement
      provider: naver-crawl
      run_id: ${{ github.run_id }}
      run_attempt: ${{ github.run_attempt }}
    secrets: inherit
